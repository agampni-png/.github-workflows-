name: Mettre a jour le badge commits

on:
  push:
    branches:
      - main
    paths-ignore:
      - "badges/badge.json"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compter les commits
        id: commits
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "Nombre de commits : $COUNT"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Creer le dossier badges
        run: mkdir -p badges

      - name: Mettre a jour badge.json
        run: |
          cat > badges/badge.json <<EOF
          {
            "schemaVersion": 1,
            "label": "commits",
            "message": "${{ steps.commits.outputs.count }}",
            "color": "blue"
          }
          EOF

      - name: Committer le badge si necessaire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add badges/badge.json

          if git diff --cached --quiet; then
            echo "Aucune modification a committer"
          else
            git commit -m "Mise a jour automatique du badge commits"
            git push
          fi
