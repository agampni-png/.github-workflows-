name: Triage des issues

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Lister les issues ouvertes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
        run: |
          gh issue list --state open --limit 50 --json number,title > issues-existantes.json
          jq "map(select(.number != ($NUMERO | tonumber)))" issues-existantes.json > issues-filtrees.json

      - name: Analyser l issue avec OpenAI
        id: analyse
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_TITRE: ${{ github.event.issue.title }}
          ISSUE_CORPS: ${{ github.event.issue.body }}
          ISSUES_EXISTANTES: issues-filtrees.json
        run: node scripts/triage-issue.js

      - name: Poser le label
        if: steps.analyse.outputs.label != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          LABEL: ${{ steps.analyse.outputs.label }}
        run: gh issue edit "$NUMERO" --add-label "$LABEL"

      - name: Poster le commentaire d accueil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUMERO: ${{ github.event.issue.number }}
          DOUBLON: ${{ steps.analyse.outputs.doublon }}
        run: |
          if [ -n "$DOUBLON" ]; then
            echo "👋 Merci pour cette issue !" > commentaire.md
            echo "" >> commentaire.md
            echo "🔁 Cette issue ressemble beaucoup à #$DOUBLON, qui est déjà ouverte. Jetez-y un œil !" >> commentaire.md
          else
            echo "👋 Merci pour cette issue ! Un mainteneur va la relire." > commentaire.md
          fi

          gh issue comment "$NUMERO" --body-file commentaire.md
            })
