name: Generer une image et deployer la galerie

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recuperer le message du dernier commit
        id: commit
        run: |
          MESSAGE=$(git log -1 --pretty=%B)
          echo "Message du commit : $MESSAGE"
          echo "message<<EOF" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Creer le dossier images
        run: mkdir -p images

      - name: Generer l image avec DynaPictures
        env:
          DYNAPICTURES_API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
        run: |
          JSON=$(jq -n \
            --arg text "$COMMIT_MESSAGE" \
            '{
              format: "png",
              params: [
                {
                  name: "text",
                  text: $text
                }
              ]
            }')

          RESPONSE=$(curl -s -X POST \
            "https://api.dynapictures.com/designs/fe74d71bb7" \
            -H "Authorization: Bearer $DYNAPICTURES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$JSON")

          echo "$RESPONSE"

          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.imageUrl')

          if [ -z "$IMAGE_URL" ] || [ "$IMAGE_URL" = "null" ]; then
            echo "Erreur : aucune URL d image recue"
            exit 1
          fi

          FILE_NAME="${GITHUB_SHA:0:7}.png"

          curl -L "$IMAGE_URL" -o "images/$FILE_NAME"

      - name: Committer l image dans le depot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add images/

          if git diff --cached --quiet; then
            echo "Aucune nouvelle image a committer"
          else
            git commit -m "Ajout image generee automatiquement"
            git push
          fi

      - name: Creer la galerie HTML
        run: |
          mkdir -p public/images
          cp images/* public/images/

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">

            <title>Galerie DynaPictures</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
                background: #f5f1e9;
                color: #161616;
              }

              header {
                padding: 70px 20px 45px;
                text-align: center;
              }

              .badge {
                display: inline-block;
                padding: 8px 16px;
                background: #161616;
                color: white;
                border-radius: 30px;
                font-size: 13px;
                margin-bottom: 20px;
              }

              h1 {
                margin: 0;
                font-size: clamp(36px, 6vw, 72px);
                letter-spacing: -2px;
              }

              .subtitle {
                max-width: 650px;
                margin: 20px auto 0;
                color: #666;
                font-size: 18px;
                line-height: 1.6;
              }

              .gallery {
                width: min(1200px, 90%);
                margin: 0 auto;
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
                gap: 30px;
                padding-bottom: 70px;
              }

              .card {
                background: white;
                border-radius: 24px;
                overflow: hidden;
                box-shadow: 0 12px 35px rgba(0,0,0,0.08);
                transition: transform 0.25s ease;
              }

              .card:hover {
                transform: translateY(-5px);
              }

              .card img {
                display: block;
                width: 100%;
                height: auto;
              }

              .card-content {
                padding: 18px 20px 22px;
              }

              .file-name {
                margin: 0;
                font-size: 14px;
                color: #777;
              }

              footer {
                text-align: center;
                padding: 30px;
                border-top: 1px solid #ddd6ca;
                color: #777;
                font-size: 14px;
              }
            </style>
          </head>

          <body>

            <header>
              <div class="badge">GitHub Actions × DynaPictures</div>

              <h1>Galerie automatisée</h1>

              <p class="subtitle">
                Chaque commit déclenche automatiquement la génération
                d'une nouvelle image grâce à GitHub Actions et DynaPictures.
              </p>
            </header>

            <main class="gallery">
          EOF

          for image in public/images/*; do
            filename=$(basename "$image")

            echo "
              <article class=\"card\">
                <img src=\"images/$filename\" alt=\"Image générée automatiquement\">
                <div class=\"card-content\">
                  <p class=\"file-name\">$filename</p>
                </div>
              </article>
            " >> public/index.html
          done

          cat >> public/index.html <<'EOF'
            </main>

            <footer>
              Projet GitHub Actions — Galerie générée automatiquement
            </footer>

          </body>
          </html>
          EOF

      - name: Deployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Envoyer une notification Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"✅ Nouvelle image générée avec succès par GitHub Actions !\"}" \
          "$DISCORD_WEBHOOK_URL"
