<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galerie des commits</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1000px;
      margin: 40px auto;
      padding: 20px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    img {
      width: 100%;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Galerie des images generees</h1>
  <div class="gallery">
<div><img src="images/4f2c01a.png" alt="4f2c01a.png"><p>4f2c01a.png</p></div>
<div><img src="images/c6e0834.png" alt="c6e0834.png"><p>c6e0834.png</p></div>
  </div>
</body>
</html>
